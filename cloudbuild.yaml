# cloudbuild.yaml — same shape as chomptron's.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/spendtron-repo/spendtron:latest', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/spendtron-repo/spendtron:$SHORT_SHA', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'us-central1-docker.pkg.dev/$PROJECT_ID/spendtron-repo/spendtron']

# Just build and push - deploy manually or via GitHub Actions
options:
  logging: CLOUD_LOGGING_ONLY
